[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200

; Build the production state machine with simulated actuators through pio test.
[env:esp32dev_test]
extends = env:esp32dev
test_framework = unity
test_filter = test_state_machine
test_build_src = yes
test_speed = 115200
board_build.esp-idf.sdkconfig_path = sdkconfig.esp32dev
board_build.cmake_extra_args = -DTANK_STATE_MACHINE_TEST=ON
